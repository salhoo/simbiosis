<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arduino pH Point Cloud</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script defer src="sketch.js"></script>
  </head>
  <body>
    <div id="boot-message">
      <div id="boot-panel">
        <p id="boot-title">Elige la camara y arranca la visual.</p>
        <p id="boot-steps">1. Buscar camaras  2. Elegir una  3. Iniciar visual</p>
        <div id="boot-controls">
          <select id="camera-select" aria-label="Seleccionar camara">
            <option value="">Primero busca las camaras disponibles</option>
          </select>
          <div id="boot-actions">
            <button id="refresh-cameras" type="button">Buscar camaras</button>
            <button id="start-system" type="button">Iniciar visual</button>
          </div>
        </div>
        <p id="boot-status">Si usas una app en el iPhone, abrela primero. El serial ya no es obligatorio: si existe un puerto autorizado se conectara solo.</p>
      </div>
    </div>
  </body>
</html>
